version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2b-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - b2b-network
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: b2b-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - b2b-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: b2b-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: b2b_platform
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: b2b_user
      MYSQL_PASSWORD: b2b_password
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - b2b-network

  redis:
    image: redis:alpine
    container_name: b2b-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - b2b-network

networks:
  b2b-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
