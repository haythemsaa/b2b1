version: '3.8'

services:
  # Application PHP
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2b_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - b2b_network
    depends_on:
      - mysql
      - redis

  # Serveur web Nginx
  nginx:
    image: nginx:alpine
    container_name: b2b_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - b2b_network
    depends_on:
      - app

  # Base de données MySQL
  mysql:
    image: mysql:8.0
    container_name: b2b_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-b2b_platform}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-b2b_user}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - b2b_network

  # Redis pour cache et queue
  redis:
    image: redis:alpine
    container_name: b2b_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - b2b_network

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2b_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./:/var/www
    networks:
      - b2b_network
    depends_on:
      - mysql
      - redis

  # Laravel Reverb (WebSocket)
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2b_reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www
    networks:
      - b2b_network
    depends_on:
      - redis

  # PhpMyAdmin (optionnel, pour développement)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: b2b_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "8081:80"
    networks:
      - b2b_network
    depends_on:
      - mysql

networks:
  b2b_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
